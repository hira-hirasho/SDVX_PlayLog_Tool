input:
  trigger_key: "F12"
  debounce_seconds: 0.1

obs:
  executable_path: "C:/Program Files/obs-studio/bin/64bit/obs64.exe"
  websocket:
    host: "localhost"
    port: 4455
    timeout_seconds: 30
  scene_name: "SDVX PlayLog Tool"

result_detection:
  threshold: 0.85
  interval_seconds: 1.0
  scale: 1.0
