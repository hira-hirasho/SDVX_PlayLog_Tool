[project]
name = "sdvx-playlog"
version = "0.1.0"
description = "SDVX PlayLog Tool"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "loguru>=0.7.3",
    "obsws-python>=1.8.0",
    "opencv-python>=5.0.0.93",
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pynput>=1.8.2",
    "python-dotenv>=1.2.3",
    "pyyaml==6.0.2",
    "pystray>=0.19.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
